name: Sync Gitee mirror

on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-gitee-mirror
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout automation branch
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Merge Gitee course updates
        env:
          GIT_TERMINAL_PROMPT: '0'
        run: |
          set -euo pipefail
          git fetch --no-tags origin master
          mirror=$(git rev-parse FETCH_HEAD)
          git fetch --no-tags https://gitee.com/yunxiangluo/ROS2_RISCV.git master
          upstream=$(git rev-parse FETCH_HEAD)
          if git merge-base --is-ancestor "$upstream" "$mirror"; then
            echo "Mirror already includes upstream: $upstream"
            exit 0
          fi
          git checkout --detach "$mirror"
          git config user.name "DuoQilai"
          git config user.email "duoqilai@outlook.com"
          if ! git merge --no-edit --signoff -m "chore: merge Gitee course updates" "$upstream"; then
            echo "::error::Upstream merge failed; resolve conflicts manually. The remote master has not been changed."
            git merge --abort
            exit 1
          fi
          git push origin HEAD:refs/heads/master
          echo "Synced upstream $upstream into master at $(git rev-parse HEAD)"
