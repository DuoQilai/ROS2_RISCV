planners:
  navfn:
    plugin: nav2_navfn_planner/NavfnPlanner
    tolerance: 0.15
    use_astar: false
    allow_unknown: false
  astar:
    plugin: nav2_navfn_planner/NavfnPlanner
    tolerance: 0.15
    use_astar: true
    allow_unknown: false
  smac2d:
    plugin: nav2_smac_planner/SmacPlanner2D
    tolerance: 0.15
    allow_unknown: false
    max_planning_time: 2.0
  hybrid:
    plugin: nav2_smac_planner/SmacPlannerHybrid
    tolerance: 0.15
    allow_unknown: false
    max_planning_time: 2.0
    minimum_turning_radius: 0.2
    motion_model_for_search: REEDS_SHEPP
    angle_quantization_bins: 72
    reverse_penalty: 2.0
    change_penalty: 0.5
    non_straight_penalty: 1.1
controllers:
  dwb:
    plugin: dwb_core::DWBLocalPlanner
    debug_trajectory_details: true
    min_vel_x: 0.0
    min_vel_y: 0.0
    max_vel_x: 0.26
    max_vel_y: 0.0
    max_vel_theta: 1.0
    min_speed_xy: 0.0
    max_speed_xy: 0.26
    min_speed_theta: 0.0
    acc_lim_x: 2.5
    acc_lim_y: 0.0
    acc_lim_theta: 3.2
    decel_lim_x: -2.5
    decel_lim_y: 0.0
    decel_lim_theta: -3.2
    vx_samples: 20
    vy_samples: 5
    vtheta_samples: 20
    sim_time: 1.7
    linear_granularity: 0.05
    angular_granularity: 0.025
    transform_tolerance: 0.2
    xy_goal_tolerance: 0.1
    trans_stopped_velocity: 0.25
    short_circuit_trajectory_evaluation: true
    stateful: true
    critics:
    - RotateToGoal
    - Oscillation
    - BaseObstacle
    - GoalAlign
    - PathAlign
    - PathDist
    - GoalDist
    BaseObstacle.scale: 0.02
    PathAlign.scale: 32.0
    PathAlign.forward_point_distance: 0.1
    GoalAlign.scale: 24.0
    GoalAlign.forward_point_distance: 0.1
    PathDist.scale: 32.0
    GoalDist.scale: 24.0
    RotateToGoal.scale: 32.0
    RotateToGoal.slowing_factor: 5.0
    RotateToGoal.lookahead_time: -1.0
  rpp:
    plugin: nav2_regulated_pure_pursuit_controller::RegulatedPurePursuitController
    desired_linear_vel: 0.26
    lookahead_dist: 1.0
    min_lookahead_dist: 0.3
    max_lookahead_dist: 2.0
    lookahead_time: 1.5
    use_velocity_scaled_lookahead_dist: true
    use_regulated_linear_velocity_scaling: true
    use_cost_regulated_linear_velocity_scaling: true
    regulated_linear_scaling_min_radius: 0.9
    regulated_linear_scaling_min_speed: 0.05
    cost_scaling_dist: 0.3
    cost_scaling_gain: 1.0
    inflation_cost_scaling_factor: 3.0
    use_collision_detection: true
    max_allowed_time_to_collision_up_to_carrot: 1.0
    use_rotate_to_heading: true
    rotate_to_heading_angular_vel: 1.0
    max_angular_accel: 3.2
    transform_tolerance: 0.2
  mppi:
    plugin: nav2_mppi_controller::MPPIController
    batch_size: 1000
    time_steps: 56
    model_dt: 0.1
    vx_std: 0.2
    vy_std: 0.0
    wz_std: 0.4
    vx_max: 0.26
    vx_min: 0.0
    vy_max: 0.0
    wz_max: 1.0
    motion_model: DiffDrive
    critics:
    - ConstraintCritic
    - ObstaclesCritic
    - GoalCritic
    - GoalAngleCritic
    - PathAlignCritic
    - PathFollowCritic
    - PathAngleCritic
    - PreferForwardCritic
    PathFollowCritic.cost_weight: 5.0
    GoalCritic.cost_weight: 5.0
    ObstaclesCritic.repulsion_weight: 10.0
